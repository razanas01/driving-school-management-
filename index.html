<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            display: flex;
            background-image: url(log5.png);
            justify-content: center;
            padding: 1rem;
            margin: 0;
            min-height: 100vh;
            background-size: cover;
            background-position: center;
             background-repeat: no-repeat;
        }
        
            
        
        .cont{
            position: relative;
            margin: 80px;
            padding: ;
            justify-content: center;
            text-align: left;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            padding: 75px;
            background: rgba(255 , 255 , 255 , 0.2);
            backdrop-filter: blur(1.5px);
            -webkit-backdrop-filter: blur(1.5px);
            border-radius: 8px;
            
        
            
            
        }
        .cont:hover{
            transition: ease 0.2s;
            transform: translateX(2px);
             box-shadow: 3px 2px 4px 0.5px  rgba( 0 , 0 , 0) ;
        }
        .lgbu{
            display: block;
            width: 70px;   
            justify-content: center;
            height: 25px;
            margin: 15px 95px 0  ;
            background-color: palevioletred;
            border-radius: 5px;
             box-shadow: 0.5px 1.5px 1px rgb(0, 0, 0), 0 8px 15px rgba(0, 0, 0, 0.2);
            transition: transform 0.15s ease, box-shadow 0.15s ease;


        }
        .lgbu:hover {
        transform: translateY(-2px);
        background-color: aquamarine;
        
       
        }
        #login-usrn{
            margin: 5px;
        }

        #login-pwd{
            margin: 5px;
        }
        .lgbu:active{
            transform: translateY(2px);
        }
        #login-usrn:hover{
            transform: translateX(4px);
            transition: transform 0.2s;
            background-color: aquamarine;
            border-radius: 5px;
            box-shadow: 0.5px 1.5px 1px rgb(0, 0, 0), 0 8px 15px rgba(0, 0, 0, 0.2);
            
        }

        #login-pwd:hover{
            transform: translateX(4px);
            transition: transform 0.2s;
            background-color: aquamarine;
            border-radius: 5px;
            box-shadow: 0.5px 1.5px 1px rgb(0, 0, 0), 0 8px 15px rgba(0, 0, 0, 0.2);
            
        }  
        #login-usrn:active{
            transform: translateX(-2px);
            transition: transform 0.2s;
            background-color: aquamarine;
            border-radius: 5px;
            box-shadow: 0.5px 1.5px 1px rgb(0, 0, 0), 0 8px 15px rgba(0, 0, 0, 0.2);
            
        } 
         #login-pwd:active{
            transform: translateX(-2px);
            transition: transform 0.2s;
            background-color: aquamarine;
            border-radius: 5px;
            box-shadow: 0.5px 1.5px 1px rgb(0, 0, 0), 0 8px 15px rgba(0, 0, 0, 0.2);
         }
        .cont #tag{
            display: block;
            text-align: right;
            position: absolute;
            right: 10px;
            margin: 5px;
            color: black;
        }
        .cont #tag:hover{
            color: blue;
            transform: translateY(2px);
        }
        .cont p{
            position: absolute;
            left: 10px;
            top: 270px

            ;
        }
        .cont #chk{
            position: absolute;
            left: 113px;
            top: 287px;
        }
        .cont #chk:hover{
            transition: ease 0.2s;
        }
        .cont #login-error{
            position: absolute;
            top: 300px;
            left: 35px;
            color: red;
        }
        

        
    </style>
</head>
<body>
    
    
    </div>
    <div class="cont">
        <h2>Login into Wheel Wise!</h2>
        <label id="usrn" for="login-usrn">Username <br>
            <input type="text" id="login-usrn" autocomplete="username" placeholder="Enter your Username" required style="width: 230px;" >
        </label> <br>
        <label id="pwd" for="login-pwd">Password<br>
            <input type="password" id="login-pwd" autocomplete="current-password" placeholder="Enter your Password" style="width: 230px;" required>
        </label><br>
        <p id="login-error" class="login-error" hidden>Incorrect Username and password Try Again </p>
        <button type="submit" class="lgbu" onclick="login()">Login</button>
        <a href="tag" id="tag">Forget Password?</a>
        <input type="checkbox" id="chk">
        <p> Remember me</p>
    </div>
    <script>
        function login(){
            const username = document.getElementById("login-usrn").value.trim();
            const password = document.getElementById("login-pwd").value;
            const errorMsg = document.getElementById("login-error");
            
            
            if(username === "admin1" && password === "Admin@123"){
               errorMsg.hidden = true;
               window.location.href = "mywebsite.html";
            }else{
                errorMsg.hidden = false
            }
            
            
            
        }
        

        
    </script>
</body>
</html>
